name: Weekly Benchmark + Analysis

on:
  schedule:
    # 2026-06-15: movido de 11:00 -> 13:00 UTC. O job coleta SERP+citation+
    # competitor para 4 verticais (~tao pesado quanto o daily) e estava sendo
    # CANCELADO toda semana ao bater o antigo timeout de 45min. Com timeout
    # realista (180min, teto do daily), 11:00 colidiria com o daily das 09:00
    # (teto 12:00) e com a calibration. 13:00 inicia apos o daily das 09:00 e
    # termina <=16:00, antes da calibration (17:00) e do daily das 21:00 — sem
    # overlap de escrita no artifact compartilhado papers-db-latest.
    - cron: '0 13 * * 0'  # domingo 10:00 BRT (UTC-3)
  workflow_dispatch:

concurrency:
  group: papers-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
  BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  PAPERS_DB_PATH: data/papers.db
  FINOPS_ALERT_EMAIL: ${{ secrets.FINOPS_ALERT_EMAIL }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # 2026-06-15: 45 -> 180. O passo "citation + competitor — all verticals"
    # sozinho excede 45min; o job vinha sendo cancelado em ~45m18s toda semana
    # desde >= 2026-05-17 (nunca completou, nunca persistiu o artifact nem o
    # relatorio). 180 = mesmo teto comprovado do daily-collect.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      # NOTA (2026-06-11): papers.db NAO vem mais do git (saiu no #20/#21).
      # Continuidade = artifact (safety net) + R2 (source of truth), adotando
      # a base MAIOR — mesmo contrato do daily-collect.
      # CORRECAO 2026-08-09/10: mesmo defeito do daily-collect. Sem a chave
      # `workflow:` o dawidd6 procurava no PROPRIO weekly-benchmark, e
      # `workflow_conclusion: ""` casa runs em qualquer estado, incluindo a que
      # esta executando e ainda nao subiu artifact. O restore nunca trazia a
      # base viva, entao o benchmark ficou preso na propria copia degenerada:
      # 864 citations contra as 63.940 do daily. Como este workflow COMITA
      # analise no main (step "Commit data + docs + reports + finops"), o
      # resultado era publicar toda semana um relatorio calculado sobre 1,4%
      # do dataset. Aponta explicitamente para o daily, que e quem coleta, e o
      # R2 abaixo ainda arbitra pela base maior.
      - name: Download previous DB (safety net)
        uses: dawidd6/action-download-artifact@v6
        with:
          name: papers-db-latest
          path: data/
          workflow: daily-collect.yml
          workflow_conclusion: success
          if_no_artifact_found: ignore
        continue-on-error: true

      # ================================================================
      # RESTORE DO R2 (source of truth) — reescrito 2026-08-10
      # A versao anterior usava boto3 + 4 secrets S3 que NUNCA foram criados,
      # entao caia no "skip silencioso" e o restore ficou inerte por dois meses.
      # Resultado: os weeklies rodaram sobre uma base de 864 citations enquanto
      # o daily tinha 63.940, e ninguem viu. Agora usa a REST API do R2, que
      # autentica com o mesmo CLOUDFLARE_API_TOKEN do resto da automacao, e
      # R2_REQUIRED=1 transforma secret ausente em falha visivel.
      # ================================================================
      - name: Restore DB from Cloudflare R2 (source of truth)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REQUIRED: "1"
        run: python scripts/r2_sync.py pull

      # Portao de sanidade: este workflow comita analise no main. Relatorio
      # calculado sobre base errada nao e "resultado parcial", e numero errado
      # com aparencia de medicao, e uma vez commitado vira historico.
      # O guard compara contra o high-water mark em data/db_floor.json, nao
      # apenas contra zero — a base degenerada de 09/08 tinha 864 citations, ou
      # seja, passaria por qualquer teste de "existe dado?".
      - name: Integrity guard — dataset nao pode encolher
        run: python scripts/db_integrity_guard.py check

      - name: Validate Python imports
        run: python -c "from src.collectors.citation_tracker import CitationTracker; from src.finops.tracker import get_tracker; print('Import chain OK')"

      - name: Run SERP vs AI Overlap (Module 3) — all verticals
        run: |
          for v in fintech varejo saude tecnologia; do
            python -m src.cli --vertical $v collect serp || true
          done

      - name: Run citation + competitor collection — all verticals
        run: |
          for v in fintech varejo saude tecnologia; do
            python -m src.cli --vertical $v collect citation || true
            python -m src.cli --vertical $v collect competitor || true
          done

      - name: Generate statistical report
        run: |
          mkdir -p output/reports
          python -m src.cli analyze report > output/reports/weekly_$(date -u +%Y-%m-%d).txt 2>&1 || true

      - name: FinOps monitor cycle
        run: python -m src.cli finops monitor

      - name: Update documentation
        run: python scripts/update-docs.py

      # Este workflow COLETA (steps "collect serp/citation/competitor" acima),
      # entao as linhas novas precisam sobreviver. O que nao pode e ele
      # sobrescrever papers-db-latest as cegas: era dai que saia o artifact de
      # 864 citations que substituia a base de 63.940 do daily (incidente
      # 2026-08-09).
      # Caminho correto: persistir no R2, que e a source of truth compartilhada
      # e onde o push so passa depois do guard e se a base nao encolheu. O daily
      # e a calibration leem de la no proximo run.
      - name: Persistir coleta do benchmark no R2 (guard + push)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REQUIRED: "1"
        run: |
          python scripts/db_integrity_guard.py check
          python scripts/r2_sync.py push

      # Artifact sob nome proprio, apenas como registro auditavel do run. O
      # ponteiro compartilhado papers-db-latest continua sendo escrito so por
      # quem tem a base completa.
      - name: Upload database (snapshot do benchmark, nome proprio)
        uses: actions/upload-artifact@v5
        with:
          name: papers-db-benchmark-${{ github.run_number }}
          path: data/papers.db
          retention-days: 90
          overwrite: true

      - name: Upload reports + dashboard
        uses: actions/upload-artifact@v5
        with:
          name: weekly-report-${{ github.run_number }}
          path: |
            output/reports/
            output/finops_dashboard.html
          retention-days: 365

      - name: Enviar relatório semanal por email
        run: python scripts/send-report.py || true
        env:
          PAPERS_DB_PATH: data/papers.db
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FINOPS_ALERT_EMAIL: caramaschiai@caramaschiai.io

      - name: Commit data + docs + reports + finops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.json data/daily_*.csv data/finops_checkpoint.json data/finops_alerts.jsonl 2>/dev/null || true
          git add output/ docs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem mudancas para commitar"
          else
            git commit -m "data: weekly benchmark + analysis $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
