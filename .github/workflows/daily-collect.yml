name: Daily Data Collection + FinOps

# Encerramento definitivo autorizado em 11/09/2026.
# O histórico executável anterior permanece nos commits anteriores.
on:
  workflow_dispatch:

permissions: {}

jobs:
  encerrado:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Informar o encerramento da coleta
        run: |
          echo "O projeto papers encerrou as coletas em 11/09/2026."
          echo "Os dados existentes permanecem disponíveis para consulta, exportação e análise."
          exit 1
