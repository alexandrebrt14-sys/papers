name: Daily Data Collection + FinOps

# Duas coletas por dia (2026-04-16 boost de potencia estatistica):
# - 06:00 BRT: captura estado matinal
# - 18:00 BRT: captura estado do fim do dia (testa variancia temporal)
# Dobra n/celula/dia combinado com a expansao de queries 12->35 por vertical.
on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT (UTC-3)
    - cron: '0 21 * * *'  # 18:00 BRT (UTC-3)
  workflow_dispatch:
    inputs:
      vertical:
        description: 'Vertical to collect (fintech|varejo|saude|tecnologia|all)'
        required: false
        default: 'all'

concurrency:
  # Onda 15 (2026-04-23): group por event_name para prevenir que workflow_dispatch
  # manual e schedule cron compartilhem slot. Incidente run 24856932674 cancelada
  # após 101min quando cron das 18:00 BRT foi despachado durante overlap.
  group: papers-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  # Onda 9 (2026-04-19): SERP overlap ativável via Brave Search. Sem
  # BRAVE_API_KEY ou com ENABLE_SERP_OVERLAP=false, SerpAIOverlap é pulado
  # silenciosamente pelo collect_all (sem custo, sem quebra).
  BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
  ENABLE_SERP_OVERLAP: ${{ vars.ENABLE_SERP_OVERLAP || 'false' }}
  PAPERS_DB_PATH: data/papers.db
  FINOPS_ALERT_EMAIL: ${{ secrets.FINOPS_ALERT_EMAIL }}
  # LLMs obrigatorios para os gates (preflight + validate-run).
  # 2026-06-17: Gemini RE-INCLUIDO como obrigatorio (5/5). Foi removido em
  # 2026-06-05 porque o 2.5 Pro (caro) esgotava o wallet e o 429 derrubava a
  # coleta INTEIRA. Agora a coleta usa gemini-2.5-flash com thinking DESLIGADO
  # (budget 0) — custo ~4x menor, wallet dura muito mais — entao a reativacao
  # plena e segura. Risco residual: auto-reload do wallet AI Studio ainda OFF
  # (acao do operador). Para voltar a deixar Gemini best-effort, defina a repo
  # var: gh variable set MANDATORY_LLMS -R alexandrebrt14-sys/papers \
  #   -b "ChatGPT,Claude,Perplexity,Groq"
  MANDATORY_LLMS: ${{ vars.MANDATORY_LLMS || 'ChatGPT,Claude,Gemini,Perplexity,Groq' }}
  # FinOps (2026-06-17): teto de tokens de "thinking" do Gemini. Com a troca para
  # gemini-2.5-flash, o default agora e 0 = thinking DESLIGADO (so o Flash aceita
  # budget 0). Reasoning e faturado como output e a deteccao de citacao nao precisa
  # dele — desligar e a maior economia. Mudanca forward-only; cada linha grava
  # citation.model_version. Ajustavel por repo var sem mexer em codigo.
  GEMINI_THINKING_BUDGET: ${{ vars.GEMINI_THINKING_BUDGET || '0' }}

jobs:
  collect-and-finalize:
    runs-on: ubuntu-latest
    # Onda 13 (2026-04-23): ampliado de 120 para 180min para dar margem
    # extra nos primeiros dias da janela v2 (rate limits variam entre
    # provedores; 5 LLMs × 4 verticais × 48 queries × 2 retries pode
    # exceder 90min quando Gemini 2.0s/query + redes mais lentas).
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      # NOTA (2026-06-11, PR #20 + R2): papers.db NAO e mais versionado em git
      # (cruzou 100MB e travava o git push no pre-receive hook). A continuidade
      # entre runs vem agora de DUAS fontes redundantes, restauradas abaixo:
      #   1) artifact papers-db-latest (safety net, step abaixo)
      #   2) Cloudflare R2 papers/db/latest.db (source of truth off-site)
      # O step "Restore DB from Cloudflare R2" adota a MAIOR das duas bases como
      # papers.db (forward-only, nunca encolhe), defendendo contra o incidente
      # 2026-04-16 (artifact "not found" -> reset para 0 linhas).
      - name: Download previous DB (safety net)
        uses: dawidd6/action-download-artifact@v6
        with:
          name: papers-db-latest
          path: data/
          workflow_conclusion: ""
          if_no_artifact_found: ignore
        continue-on-error: true

      # ================================================================
      # RESTORE DO ARTIFACT DO RECOVER — fix 2026-06-11 (incidente run #155)
      # O step acima (dawidd6 sem `workflow:`) so enxerga artifacts gravados
      # pelo PROPRIO daily-collect.yml. O artifact papers-db-latest promovido
      # pelo recover-historical-db.yml pertence a OUTRO workflow e era
      # invisivel aqui — por isso o run #155 regenerou o dashboard com 216
      # queries mesmo apos a recuperacao ter promovido 62.820 citations.
      # Baixa o artifact do recover para data/_recover/ e adota a base com
      # MAIS linhas de citations (forward-only, nunca encolhe).
      # ================================================================
      - name: Download recovered DB (recover-historical-db artifact)
        uses: dawidd6/action-download-artifact@v6
        with:
          name: papers-db-latest
          path: data/_recover/
          workflow: recover-historical-db.yml
          workflow_conclusion: success
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Adopt richer base (recovered vs artifact)
        run: |
          python - <<'PY'
          import os, shutil, sqlite3

          def citation_rows(path):
              if not os.path.exists(path):
                  return -1
              try:
                  con = sqlite3.connect(path)
                  try:
                      n = con.execute("SELECT COUNT(*) FROM citations").fetchone()[0]
                  except sqlite3.Error:
                      n = 0
                  con.close()
                  return n
              except sqlite3.Error:
                  return -1

          cur = "data/papers.db"
          rec = "data/_recover/papers.db"
          r_cur, r_rec = citation_rows(cur), citation_rows(rec)
          print(f"citations: artifact daily={r_cur}  artifact recover={r_rec}")
          if r_rec > r_cur:
              shutil.copyfile(rec, cur)
              print(f"Base do recover adotada ({r_rec} > {r_cur} linhas)")
          else:
              print("Base do daily mantida (>= recover ou recover ausente)")
          shutil.rmtree("data/_recover", ignore_errors=True)
          PY

      # ================================================================
      # RESTORE DB DO CLOUDFLARE R2 (source of truth) — Onda 2026-06-11
      # Baixa papers/db/latest.db do R2 (mesmo bucket do backup off-site no
      # fim do run) e compara, por contagem total de linhas, com o papers.db
      # vindo do artifact. Adota a base MAIOR como source of truth. Assim,
      # se QUALQUER uma das fontes vier vazia/menor (reset, artifact ausente,
      # upload truncado), a outra prevalece — forward-only, nunca encolhe.
      # Skip silencioso (exit 0) se os secrets do R2 nao estiverem presentes,
      # preservando 100% o comportamento atual baseado em artifact.
      # ================================================================
      # ================================================================
      # RESTORE DO R2 (source of truth) — reescrito 2026-08-10
      # A versao anterior usava boto3 + 4 secrets S3 que NUNCA foram criados,
      # entao caia no "skip silencioso" e o restore ficou inerte por dois meses.
      # Resultado: os weeklies rodaram sobre uma base de 864 citations enquanto
      # o daily tinha 63.940, e ninguem viu. Agora usa a REST API do R2, que
      # autentica com o mesmo CLOUDFLARE_API_TOKEN do resto da automacao, e
      # R2_REQUIRED=1 transforma secret ausente em falha visivel.
      # ================================================================
      - name: Restore DB from Cloudflare R2 (source of truth)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REQUIRED: "1"
        run: python scripts/r2_sync.py pull
      # Barra base degenerada ANTES de coletar/analisar. Ver incidente
      # 2026-08-09 em scripts/db_integrity_guard.py.
      - name: Integrity guard — dataset nao pode encolher
        run: python scripts/db_integrity_guard.py check
      - name: Validate Python imports
        run: python -c "from src.collectors.citation_tracker import CitationTracker; from src.finops.tracker import get_tracker; print('Import chain OK')"

      # ================================================================
      # PRE-FLIGHT LLM CHECK (2026-04-26): valida que todas as 5 APIs
      # respondem ANTES de iniciar o loop de verticais. Bloqueante.
      # Motivacao: incidente 24/04 — Anthropic credit balance esgotado
      # rodou 30min de fintech sem Claude (gap seletivo no dataset v2).
      # Custo: ~5 calls de 1 token (<US$0.0001).
      # ================================================================
      # ================================================================
      # RECONCILE FINOPS BUDGET (2026-06-17): o teto mensal vive na tabela
      # SQLite finops_budgets DENTRO do papers.db (restaurado do R2/artifact),
      # NAO no codigo — e _ensure_budgets so INSERE se a plataforma estiver
      # ausente, nunca ATUALIZA um teto ja existente. Resultado: o teto do
      # Google ficou preso em $50 e bateu 108% (is_blocked) em 2026-06-11,
      # reprovando o provider mesmo apos recarregar o wallet do AI Studio.
      # Este step aplica o teto desejado de forma idempotente (UPDATE) sobre o
      # DB restaurado, a cada run. Ajustavel por repo var sem mexer no codigo:
      #   gh variable set GOOGLE_MONTHLY_BUDGET -R alexandrebrt14-sys/papers -b "90"
      # ================================================================
      - name: Reconcile FinOps budget (Google ceiling)
        run: |
          python -m src.cli finops set-budget google \
            --monthly ${{ vars.GOOGLE_MONTHLY_BUDGET || '90' }} \
            --daily ${{ vars.GOOGLE_DAILY_BUDGET || '3' }}
        continue-on-error: true

      - name: Preflight LLM connectivity + auth check
        run: python scripts/preflight_llm_check.py

      # ================================================================
      # COLETA SEQUENCIAL — todas as verticais no MESMO job/runner
      # ================================================================
      # IMPORTANTE: antes, cada vertical rodava num job separado (matrix strategy)
      # e cada um baixava o artifact do ultimo run com SUCESSO via dawidd6/v6,
      # sobrescrevendo o artifact a cada upload. Resultado: so a ultima vertical
      # (tecnologia) sobrevivia. Agora tudo roda no mesmo runner com o MESMO
      # papers.db, eliminando o bug de chain de artifacts.
      # Incidente: 2026-04-08 a 2026-04-12 (5 dias com so 1 vertical coletada).
      # ================================================================

      - name: Determine verticals to collect
        id: verticals
        run: |
          INPUT_VERTICAL="${{ github.event.inputs.vertical || 'all' }}"
          if [ "$INPUT_VERTICAL" = "all" ]; then
            echo "list=fintech varejo saude tecnologia" >> $GITHUB_OUTPUT
          else
            echo "list=$INPUT_VERTICAL" >> $GITHUB_OUTPUT
          fi

      - name: Collect all verticals (sequential — same DB)
        run: |
          VERTICALS="${{ steps.verticals.outputs.list }}"
          FAILED_VERTICALS=""

          for V in $VERTICALS; do
            echo ""
            echo "========================================"
            echo "  Coletando vertical: $V"
            echo "========================================"

            # Module 1: Citation Tracker
            if python -m src.cli --vertical "$V" collect citation; then
              echo "[OK] $V citation collection done"
            else
              echo "[FAIL] $V citation collection failed"
              FAILED_VERTICALS="$FAILED_VERTICALS $V"
            fi

            # Module 2: Competitor Benchmark (non-blocking)
            python -m src.cli --vertical "$V" collect competitor || true

            # Module 7: Context Analyzer (non-blocking)
            # Wire 2026-04-23: antes só `collect all` rodava analyzer, mas
            # workflow usa `collect citation` — citation_context ficava vazio
            # em varejo/saude/tecnologia. Processa até 500 citations pendentes.
            python -m src.cli --vertical "$V" collect context --limit 500 || true

            # Export CSV snapshot
            python -m src.cli --vertical "$V" db export --format csv --output data/daily || true

            echo "[DONE] Vertical $V finalizada"
          done

          # Fail-loud se QUALQUER vertical falhou — coberura parcial gera
          # warnings estatisticos n<30 em celulas da vertical faltante e
          # torna a serie temporal incompleta para analise longitudinal.
          # Antes: so falhava se TODAS falhassem. Mudanca 2026-04-16.
          if [ -n "$FAILED_VERTICALS" ]; then
            TOTAL=$(echo $VERTICALS | wc -w)
            FAILED=$(echo $FAILED_VERTICALS | wc -w)
            echo "CRITICO: $FAILED/$TOTAL verticais falharam: $FAILED_VERTICALS"
            echo "Coleta incompleta invalida a serie temporal. Investigar logs acima."
            exit 1
          fi

      # Fail-loud per-LLM POS-LOOP (fix 2026-04-23 Onda 2):
      # Valida que TODOS os providers em MANDATORY_LLMS produziram rows no
      # run agregado (cross-vertical). Antes, rodava dentro de `collect citation`
      # por-vertical e mataria o bash loop antes de 2a/3a/4a vertical rodar.
      # Incidente coberto: Groq silencioso 10-22/04.
      - name: Validate run — all mandatory LLMs produced rows
        run: python -m src.cli collect validate-run --since-minutes 120

      # Onda 14 (2026-04-23): validator v2 end-to-end em 6 dimensões
      # (cobertura per-LLM e per-vertical, colunas v2 populadas, fictitious
      # hit rate, model_versions drift tracking, citation rate por LLM).
      # Exit 2 = failure crítico · exit 1 = warning · exit 0 = pass.
      # continue-on-error para não bloquear commit de dados em warnings.
      - name: Validate v2 collection (schema + coverage + drift)
        run: python scripts/validate_v2_collection.py --since-minutes 120 --verbose
        continue-on-error: true

      # ================================================================
      # ARTIFACT UPLOAD INTERMEDIARIO — safety net antes do finalize.
      # Se qualquer step de finalize falhar, o DB com dados coletados
      # ja esta salvo como artifact e sera recuperado no proximo run.
      # ================================================================
      # Eleva o high-water mark so DEPOIS de a coleta validar. O piso e o que
      # permite detectar, no run seguinte, que a base restaurada encolheu.
      - name: Elevar piso de integridade
        run: python scripts/db_integrity_guard.py update

      - name: Upload database (intermediate safety net)
        uses: actions/upload-artifact@v5
        with:
          name: papers-db-latest
          path: data/papers.db
          retention-days: 90
          overwrite: true

      # ================================================================
      # FINALIZE — tudo no mesmo job, sem download de artifact necessario.
      # Todos os steps de finalize usam continue-on-error para que uma
      # falha em Supabase/docs/dashboard NAO bloqueie o artifact upload
      # final nem o git commit.
      # ================================================================

      - name: Aplicar migracoes do schema
        run: python -c "from src.db.client import DatabaseClient; c = DatabaseClient(); c.connect(); c.close(); print('schema migrations OK')"

      - name: FinOps monitor cycle
        run: python -m src.cli finops monitor
        continue-on-error: true

      # CORRECAO: continue-on-error evita que exit code 2 (creds ausentes)
      # ou falha de rede no Supabase bloqueie o pipeline inteiro.
      # Incidente potencial identificado na auditoria 2026-04-12.
      - name: Sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/sync_to_supabase.py
        continue-on-error: true

      # CORRECAO: continue-on-error evita que DB vazio ou tabela ausente
      # (first-ever run) bloqueie os steps seguintes.
      - name: Generate dashboard_data.json
        run: python scripts/generate_dashboard_json.py
        continue-on-error: true

      - name: Update documentation
        run: python scripts/update-docs.py
        continue-on-error: true

      # ================================================================
      # GIT COMMIT + PUSH UNICO — consolida tudo em um unico push.
      # CORRECAO: antes havia 2 pushes separados (dashboard_data.json
      # primeiro, depois CSVs/docs). Se qualquer step entre eles falhava
      # ou outro workflow pushava no intervalo, o segundo push falhava
      # com "non-fast-forward". Agora tudo e commitado e pushado junto.
      # ================================================================
      - name: Commit all data + docs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Estratégia (fix 2026-05-12 — incidente run 25700155296):
          # 1) Snapshot dos arquivos gerados nesta run (fora do git).
          # 2) Reset hard para origin/main (descarta o que outro workflow
          #    possa ter empurrado durante a coleta).
          # 3) Restaurar arquivos como overlay.
          # 4) Commit + push, com retry se push for rejeitado.
          # Motivação: papers.db é binário; rebase em conflito é intratável.
          # Antes: `git pull --rebase || true` deixava o repo em detached
          # HEAD com conflitos não resolvidos, push falhava com exit 128.

          TMPDIR=$(mktemp -d)
          for p in data/dashboard_data.json data/db_floor.json \
                   data/finops_checkpoint.json data/finops_alerts.jsonl \
                   output/finops_dashboard.html docs data/daily_*.csv; do
            [ -e "$p" ] || continue
            mkdir -p "$TMPDIR/$(dirname "$p")"
            cp -r "$p" "$TMPDIR/$(dirname "$p")/"
          done

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            cp -r "$TMPDIR"/. .

            git add data/dashboard_data.json \
                    data/finops_checkpoint.json data/finops_alerts.jsonl \
                    output/finops_dashboard.html docs/ 2>/dev/null || true
            git add data/daily_*.csv 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Sem mudancas para commitar apos sync com origin (tentativa $attempt)"
              exit 0
            fi

            git commit -m "data: daily collection $(date -u +%Y-%m-%d) [skip ci]"
            if git push origin main; then
              echo "Push OK na tentativa $attempt"
              exit 0
            fi
            echo "Push tentativa $attempt rejeitado — re-sync com remoto"
            sleep $((attempt * 3))
          done

          echo "FALHA: push rejeitado apos 5 tentativas"
          exit 1

      # ================================================================
      # ARTIFACT UPLOADS FINAIS — ANTES do health check para garantir
      # que mesmo uma falha no health check nao impede a persistencia
      # do DB consolidado. O artifact "latest" sobrescreve o intermediario
      # com a versao pos-finalize (inclui finops rollup etc).
      # ================================================================
      - name: Upload database (latest — post-finalize)
        uses: actions/upload-artifact@v5
        with:
          name: papers-db-latest
          path: data/papers.db
          retention-days: 90
          overwrite: true

      - name: Upload database (dated backup)
        uses: actions/upload-artifact@v5
        with:
          name: papers-db-${{ github.run_number }}
          path: data/papers.db
          retention-days: 90

      # ================================================================
      # OFF-SITE BACKUP (Onda 16, 2026-04-29 health-check):
      # Mitigação para perda catastrófica de papers.db (artifact retention
      # 90d + GitHub-only é single point of failure). Envia para Cloudflare
      # R2 se secrets configurados; silenciosamente skip se não houver.
      # ================================================================
      # ================================================================
      # BACKUP OFF-SITE NO R2 — reescrito 2026-08-10 (REST API)
      # r2_sync.py push recusa upload quando a base local e menor que a remota,
      # entao um run degenerado nao consegue destruir o backup.
      # ================================================================
      - name: Off-site backup to Cloudflare R2
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_REQUIRED: "1"
        run: |
          python scripts/db_integrity_guard.py check
          python scripts/r2_sync.py push
      - name: Upload structured collection logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: structured-logs-${{ github.run_number }}
          path: .logs/structured/
          retention-days: 30
          if-no-files-found: ignore

      # Revalidar paginas publicas na Vercel imediatamente apos o commit
      # para que /research e /papers-roadmap reflitam os novos dados sem
      # esperar o TTL do ISR. Silenciosamente ignora se o secret nao estiver
      # configurado no repo.
      - name: Revalidate Vercel pages
        if: success()
        run: |
          if [ -n "${{ secrets.VERCEL_REVALIDATE_SECRET }}" ]; then
            for P in /research /papers-roadmap /roadmap; do
              curl -s -X POST "https://alexandrecaramaschi.com/api/revalidate" \
                -H "Content-Type: application/json" \
                -d "{\"secret\":\"${{ secrets.VERCEL_REVALIDATE_SECRET }}\",\"path\":\"$P\"}" \
                || echo "revalidate $P falhou (nao bloqueia)"
            done
          else
            echo "VERCEL_REVALIDATE_SECRET nao configurado — pulando revalidate"
          fi
        continue-on-error: true

      # Enviar relatorio por email (antes do health check para que o
      # relatorio saia mesmo se o check falhar)
      - name: Enviar relatorio diario por email
        run: python scripts/send-report.py || true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FINOPS_ALERT_EMAIL: ${{ secrets.FINOPS_ALERT_EMAIL }}

      # ================================================================
      # HEALTH CHECK — ultimo step. Falha dispara alertas mas NAO
      # impede artifact upload nem git commit (ambos ja rodaram acima).
      # ================================================================
      - name: Health check (gating)
        id: health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
        run: python scripts/health_check.py --min-obs-per-day 200
        continue-on-error: true

      # Alerta por email (Resend) em caso de falha de coleta ou health check.
      # Cria issue + envia email. Objetivo: publicacao cientifica julho/2026
      # exige pipeline 100% confiavel — zero tolerancia a falha silenciosa.
      - name: Alert on failure (Resend + Issue)
        if: steps.health.outcome == 'failure' || failure()
        run: |
          set +e
          if [ -n "${{ secrets.RESEND_API_KEY }}" ] && [ -n "${{ secrets.FINOPS_ALERT_EMAIL }}" ]; then
            curl -s -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"from\": \"papers-alerts@mail.brasilgeo.ai\",
                \"to\": \"${{ secrets.FINOPS_ALERT_EMAIL }}\",
                \"subject\": \"[ALERTA] Papers daily-collect falhou em $(date -u '+%Y-%m-%d %H:%M')\",
                \"html\": \"<h2>Falha no pipeline Papers</h2><p>Run <a href='https://github.com/alexandrebrt14-sys/papers/actions/runs/${{ github.run_id }}'>#${{ github.run_number }}</a> teve falha de coleta ou health check.</p><p><strong>Impacto na publicacao cientifica (julho/2026):</strong> gap de dados compromete serie temporal longitudinal.</p><p><strong>Acao imediata:</strong> abrir o run e ler o LOG DO JOB para achar o step vermelho — pode ser coleta (vertical/LLM), push (papers.db &gt; 100MB), health check ou Supabase/R2. NAO basta re-executar.</p>\"
              }" | head -c 200
          fi
          # Rastreamento por issue. Ate 10/08 cada falha abria uma issue nova:
          # a mesma causa (saldo da OpenAI) gerou sete issues abertas em duas
          # semanas, o que enterra o sinal em vez de destaca-lo. Agora comenta
          # na issue de falha ja aberta, se houver, e so cria uma nova quando
          # nao existe nenhuma.
          EXISTING=$(gh issue list --repo alexandrebrt14-sys/papers \
            --label "pipeline-failure" --state open \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          RUN_LINK="https://github.com/alexandrebrt14-sys/papers/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo alexandrebrt14-sys/papers \
              --body "Run #${{ github.run_number }} falhou tambem ($(date -u +%Y-%m-%d\ %H:%M) UTC). Link: $RUN_LINK" \
              || echo "issue comment failed"
            echo "Falha registrada na issue #$EXISTING (nenhuma issue nova criada)."
          else
            gh issue create \
              --repo alexandrebrt14-sys/papers \
              --title "daily-collect falhou em $(date -u +%Y-%m-%d)" \
              --body "Run #${{ github.run_number }} falhou. Link: $RUN_LINK -- Abrir o log do job e identificar o step vermelho ANTES de re-executar. HTTP 429 credit_balance_exhausted e saldo do provider, nao chave invalida: rotacionar nao resolve." \
              --label "pipeline-failure" \
              || echo "issue creation failed"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Falha o workflow DE PROPOSITO se health check falhou, para aparecer
      # vermelho no GitHub Actions e no badge da README.
      - name: Fail workflow if health check failed
        if: steps.health.outcome == 'failure'
        run: |
          echo "Health check falhou — workflow marcado como falho para alerta."
          exit 1
